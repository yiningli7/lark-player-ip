<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lark Player IP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tilt+Warp&family=Momo+Trust+Display&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* The design is a fixed artboard; colors stay the same in light and dark mode on purpose. */
  :root {
    --page: #f1f1f1;
    --dark: #121313;
    --blue: #2391fe;
    --pill: #bcdeff;
    --ink: #373737;
    --ink-strong: #3d3836;
    --muted: #958f8d;
    --muted-2: #7b7370;
    --rule: #d9d9d9;
    --round: "Yuanti SC", "YuanTi SC", "Noto Sans SC", "PingFang SC", sans-serif;
    --maru: "975Maru SC", "Yuanti SC", "Noto Sans SC", "PingFang SC", sans-serif;
    --display: "Tilt Warp", "Yuanti SC", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #f1f1f1; } }
  :root[data-theme="dark"] { --page: #f1f1f1; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--page); overflow-x: hidden; }

  /* 1920px artboard scaled to the viewport width */
  .viewport { width: 100%; position: relative; overflow: hidden; }
  .stage {
    position: absolute; top: 0; left: 0;
    width: 1920px; height: 2286px;
    background: var(--page);
    transform-origin: 0 0;
  }
  .stage > * { position: absolute; }
  .stage img { display: block; max-width: none; }
  .fill { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cover { object-fit: cover; }
  p { line-height: normal; word-break: break-word; }

  .pill-bg { background: var(--pill); height: 48px; width: 211px; border-radius: 24px; top: 1763px; }
  .dark { background: var(--dark); }
  .h-tag { font-family: var(--maru); font-weight: 700; font-size: 26.24px; line-height: 1.98; color: var(--ink); white-space: nowrap; text-transform: uppercase; }
  .outline-pill { border: 3px solid var(--ink); height: 50px; border-radius: 36.5px; top: 1391px; }
  .issue { top: 1761px; letter-spacing: -2.0992px; }
</style>
</head>
<body>
<main class="viewport" id="viewport">
  <div class="stage" id="stage" role="img" aria-label="Lark Player 品牌IP形象升级 — 项目背景">

    <!-- light-blue pills behind the three issues -->
    <div class="pill-bg" style="left:565px"></div>
    <div class="pill-bg" style="left:855px"></div>
    <div class="pill-bg" style="left:1145px"></div>

    <div style="left:1218px;top:278px;width:442px;height:524.323px"><img class="fill" src="assets/677ab.svg" alt=""></div>

    <!-- hero background -->
    <div style="left:0;top:0;width:1920px;height:1081px"><img class="fill cover" src="assets/95579.png" alt=""></div>
    <div style="left:204px;top:98px;width:611px;height:789px"><img class="fill" src="assets/15dd9.svg" alt=""></div>
    <div class="dark" style="left:266px;top:697px;width:429px;height:298px"></div>
    <div class="dark" style="left:451px;top:333px;width:534px;height:519px;border-radius:197px"></div>
    <div class="dark" style="left:829px;top:-213px;width:1027px;height:311px"></div>
    <div class="dark" style="left:44px;top:-213px;width:1027px;height:311px"></div>
    <div style="left:1047.5px;top:176px;width:651px;height:650.501px"><img class="fill" src="assets/06759.svg" alt=""></div>

    <!-- hero titles -->
    <p style="left:153.72px;top:379px;width:893.728px;height:206.245px;font-family:var(--display);font-size:162.959px;color:var(--blue);text-transform:capitalize">lark player</p>
    <h1 style="left:154px;top:562px;width:858.96px;font-family:var(--round);font-weight:700;font-size:96.276px;color:#fff;line-height:normal">品牌IP形象升级</h1>

    <!-- illustrated bird -->
    <div style="left:1015px;top:149px;width:568.094px;height:670.485px;display:flex;align-items:center;justify-content:center">
      <div style="transform:rotate(0.88deg);flex:none">
        <div style="position:relative;width:558px;height:662px"><img class="fill cover" src="assets/a2c5b.png" alt="Lark Player 小鸟 IP 形象"></div>
      </div>
    </div>

    <!-- BRANDING badge -->
    <div style="left:151px;top:96px;width:300px;border:6px solid #fff;border-radius:40px;padding:0 25px;display:flex;align-items:center;justify-content:center;overflow:hidden">
      <p style="width:189px;font-family:'Momo Trust Display',var(--display);font-size:32px;color:#fff;text-transform:uppercase">branding</p>
    </div>

    <!-- overview section -->
    <p style="left:106px;top:1224px;font-family:var(--display);font-size:40.283px;color:#958e8c;text-transform:uppercase;white-space:nowrap">brand overview</p>
    <p style="left:1510px;top:1224px;font-family:var(--maru);font-weight:700;font-size:24px;line-height:1.5;letter-spacing:3.84px;color:var(--muted-2);text-transform:uppercase;white-space:nowrap">IP case introduction</p>
    <h2 style="left:101px;top:1281.33px;font-family:var(--maru);font-weight:700;font-size:80px;color:var(--ink-strong);line-height:normal;white-space:nowrap">项目背景 /</h2>

    <div class="outline-pill" style="left:101px;width:111px"></div>
    <div class="outline-pill" style="left:228px;width:151px"></div>
    <p class="h-tag" style="left:121px;top:1390px">ip设计</p>
    <p class="h-tag" style="left:251px;top:1390px">出海品牌</p>

    <div style="left:101px;top:1492px;width:12px;height:129px;background:var(--rule)"></div>
    <p style="left:141px;top:1475px;width:802px;height:166px;font-family:var(--round);font-size:26.24px;line-height:1.98;color:var(--ink)">Lark Player 是一款主要面向南美市场的音乐播放器产品。为进一步提升品牌辨识度，建立与用户之间的情感连接，品牌希望通过 IP 形象塑造更具亲和力和记忆点的品牌人格，增强用户认同感与品牌粘性</p>

    <p class="h-tag issue" style="left:584px">形象亲和力不足</p>
    <p class="h-tag" style="left:881px;top:1761px">场景表达受限</p>
    <p class="h-tag issue" style="left:1164px">视觉体系不完善</p>

    <!-- three old IP images -->
    <div style="left:700px;top:1883px;width:188px;height:180px;border-radius:45px 0 0 45px;overflow:hidden">
      <img src="assets/e98d3.png" alt="旧版 IP 毛绒形象" style="position:absolute;left:0;top:-0.07%;width:109.04%;height:144.02%">
    </div>
    <div style="left:888px;top:1883px;width:167px;height:180px"><img class="fill cover" src="assets/0e18e.png" alt="旧版 IP 场景插画"></div>
    <div style="left:1055px;top:1883px;width:180px;height:180px;border-radius:0 45px 45px 0;overflow:hidden">
      <img class="fill cover" src="assets/10740.png" alt="旧版 IP 头像">
    </div>

    <!-- pink star -->
    <div style="left:1066px;top:922px;width:338.303px;height:338.303px;display:flex;align-items:center;justify-content:center">
      <div style="transform:rotate(-14.98deg);flex:none;position:relative;width:276.28px;height:276.28px">
        <div style="position:absolute;inset:23.68%"><img src="assets/9b055.svg" alt="" style="width:100%;height:100%"></div>
      </div>
    </div>

    <p style="left:106px;top:2125px;font-family:var(--round);font-size:48px;color:var(--muted);white-space:nowrap">&lt;2026&gt;</p>
  </div>
</main>
<script>
  (function () {
    var W = 1920, H = 2286;
    var vp = document.getElementById('viewport');
    var stage = document.getElementById('stage');
    function fit() {
      var s = vp.clientWidth / W;
      stage.style.transform = 'scale(' + s + ')';
      vp.style.height = (H * s) + 'px';
    }
    fit();
    window.addEventListener('resize', fit);
  })();
</script>
</body>
</html>
